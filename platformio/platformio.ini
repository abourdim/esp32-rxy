; ESP32-C3 Super Mini — Micro:bit Remote firmware
; Talks the rxy (abourdim.github.io/bit-rxy) BLE protocol.
;
; Build:    pio run
; Upload:   pio run -t upload
; Monitor:  pio device monitor

[env:esp32-c3-supermini]
platform        = espressif32
; Pin the Arduino-ESP32 core to a newer, IDF 5.x-based release (2.0.14).
; Picked up during debugging a persistent rc=6 (BLE_HS_ENOMEM) that
; turned out to be unrelated to the core version — the real cause was
; sendCfg() running synchronously inside a BLE callback (see main.cpp,
; gGetCfgRequested). Left pinned since it's the exact combination this
; firmware has been tested against; bump the version if a newer one is
; available.
platform_packages =
    platformio/framework-arduinoespressif32 @ 3.20014.231204
board           = esp32-c3-devkitm-1
framework       = arduino
monitor_speed   = 115200
; Native USB-CDC on the ESP32-C3 misinterprets DTR/RTS toggles as the
; "enter download mode" signal — so opening pio device monitor with the
; defaults knocks the board back into the ROM bootloader. Disable both.
monitor_dtr     = 0
monitor_rts     = 0
; ESP32-C3 Super Mini uses native USB-CDC, which causes two failures
; with the default esptool flow:
;   1. The mid-upload baud switch (115200 -> 460800) crashes the CDC
;      endpoint: "No serial data received".
;   2. When the flasher stub takes over from the ROM bootloader, the
;      USB-CDC endpoint re-enumerates and the first post-stub command
;      (read flash JEDEC ID) falls into a dead window:
;      "Unable to verify flash chip connection".
; Pinning upload_speed avoids (1); --no-stub avoids (2) by using the
; ROM bootloader for the whole upload. Slower (~60-90 s) but reliable.
upload_speed    = 115200
upload_flags    = --no-stub

; The ESP32-C3 Super Mini exposes its USB-C port via the chip's native
; USB peripheral (no CH340/CP2102 bridge), so we need USB-CDC for Serial.
;
; CONFIG_NIMBLE_CPP_LOG_LEVEL / _ENABLE_RETURN_CODE_TEXT: NimBLE's own
; NIMBLE_LOGE("failed to send value, rc=%d %s", ...) inside notify() is
; compiled out at the default log level (0 = NONE), which is why every
; "notify() reported failure" in our own logging never showed *why*.
; Enabling this surfaces the real NimBLE host error code so we stop
; guessing at the root cause of the CFG-transfer stalls.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -D CONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT

lib_deps =
    h2zero/NimBLE-Arduino @ ^2.2.0

; -----------------------------------------------------------------------
; If you are using a different ESP32 board, add another [env:...] section.
; Examples:
;
;   [env:esp32-devkit]      ; classic ESP32 DevKit
;   platform   = espressif32
;   board      = esp32dev
;   framework  = arduino
;   lib_deps   = h2zero/NimBLE-Arduino @ ^2.2.0
;
;   [env:esp32-s3-supermini]
;   platform   = espressif32
;   board      = esp32-s3-devkitc-1
;   framework  = arduino
;   build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
;   lib_deps   = h2zero/NimBLE-Arduino @ ^2.2.0
