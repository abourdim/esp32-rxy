; Minimal BLE notify/indicate throughput probe — isolates whether the
; ESP32-C3 + NimBLE-Arduino combo can sustain a rapid send burst at all,
; independent of the full esp32-rxy application (CFG protocol, demo
; loop, connection-param tuning, etc). See ../platformio/platformio.ini
; for why the core is pinned this way.
;
; Build:    pio run
; Upload:   pio run -t upload
; Monitor:  pio device monitor

[env:esp32-c3-supermini]
platform          = espressif32
platform_packages =
    platformio/framework-arduinoespressif32 @ 3.20014.231204
board             = esp32-c3-devkitm-1
framework         = arduino
monitor_speed     = 115200
monitor_dtr       = 0
monitor_rts       = 0
upload_speed      = 115200
upload_flags      = --no-stub

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -D CONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT

lib_deps =
    h2zero/NimBLE-Arduino @ ^2.2.0
